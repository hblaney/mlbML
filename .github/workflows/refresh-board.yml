name: Refresh Live Board

on:
  schedule:
    # Morning catch-up when Daily Model cron is missed (~5–9 AM CT = 10–14 UTC).
    - cron: "0 10-14 * * *"
    # Hourly during game day (~10 AM – 10 PM CT).
    - cron: "0 15-23 * * *"
    - cron: "0 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Chicago
      PYTHONPATH: scripts/model
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Regenerate today's board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
          ODDS_MARKETS: h2h,spreads,totals
        run: |
          set -euo pipefail
          python3 scripts/model/generate_today_board.py 2>&1 | tee board-gen.log
          test "${PIPESTATUS[0]}" -eq 0
          board_at=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['board_generated_at'])")
          echo "board_generated_at=${board_at}"
          test -n "${board_at}"

      - name: Update live bankroll
        continue-on-error: true
        run: python3 scripts/model/update_live_bankroll.py

      - name: Sync prediction history and accuracy
        run: |
          set -euo pipefail
          yesterday=$(python3 -c "from datetime import date, timedelta; print((date.today()-timedelta(days=1)).isoformat())")
          trained=$(
            python3 -c "import json; from pathlib import Path; p=Path('public/prediction-history.json'); print(json.loads(p.read_text()).get('trained_through','') if p.exists() else '')" \
              || echo ""
          )
          if [ -z "$trained" ] || [[ "$trained" < "$yesterday" ]]; then
            echo "History stale (${trained:-missing} < ${yesterday}); regenerating accuracy."
            python3 scripts/model/generate_prediction_history.py --current-season-only
            python3 scripts/model/generate_accuracy_output.py
          else
            echo "History current through ${trained}; skipping accuracy rebuild."
          fi

      - name: Refresh model health card
        continue-on-error: true
        run: python3 scripts/model/model_health.py

      - name: Verify board integrity
        run: python3 scripts/model/prediction_integrity.py --full --strict-recompute

      - name: Consistency audit (blocks a bad push)
        run: python3 scripts/model/consistency_audit.py

      - name: Commit and push refreshed board
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/predictions.json public/live-bankroll.json public/prediction-history.json public/accuracy.json public/model-health.json data/live-bankroll-state.json data/model/daily_edge.pkl
          if git diff --staged --quiet; then
            echo "Board unchanged since last refresh (lines/probabilities identical)."
            exit 0
          fi
          git commit -m "Refresh live MLB board ($(TZ=America/Chicago date '+%Y-%m-%d %I:%M %p %Z'))"
          git pull --rebase origin main
          git push origin main

      - name: Verify live board timestamp
        run: |
          set -euo pipefail
          today=$(date +%F)
          generated=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['generated_at'])")
          if [ "$generated" != "$today" ]; then
            echo "::error::Expected generated_at=${today}, got ${generated}"
            exit 1
          fi
          echo "Board published for ${today} ($(python3 -c "import json; print(len(json.load(open('public/predictions.json'))['predictions']))") games)."
