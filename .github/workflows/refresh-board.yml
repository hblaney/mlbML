name: Refresh Live Board

# DISABLED 2026-06-24 at user request: this workflow was auto-committing/pushing a
# regenerated board to main on an hourly schedule, overwriting manual changes.
# Manual-only now — re-add the schedule block to re-enable automatic refreshes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Chicago
      PYTHONPATH: scripts/model
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Restore pitcher/team stat caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache/pitcher_stats_asof
            data/cache/team_stats
          key: stats-cache-v2-${{ hashFiles('scripts/model/pitcher_stats_provider.py', 'scripts/model/team_stats_provider.py') }}
          restore-keys: |
            stats-cache-v2-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Regenerate today's board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
          ODDS_MARKETS: h2h,spreads,totals
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Board generation attempt ${attempt}/3..."
            if python3 scripts/model/generate_today_board.py 2>&1 | tee "board-gen-${attempt}.log"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::generate_today_board failed after 3 attempts"
              tail -40 "board-gen-${attempt}.log"
              exit 1
            fi
            echo "Retrying in 30s..."
            sleep 30
          done
          board_at=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['board_generated_at'])")
          generated=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['generated_at'])")
          today=$(date +%F)
          echo "board_generated_at=${board_at} generated_at=${generated}"
          test -n "${board_at}"
          if [ "${generated}" != "${today}" ]; then
            echo "::error::Expected generated_at=${today}, got ${generated}"
            exit 1
          fi

      - name: Full publish if board was stale (history + lock + health)
        run: |
          set -euo pipefail
          yesterday=$(python3 -c "from datetime import date, timedelta; print((date.today()-timedelta(days=1)).isoformat())")
          trained=$(python3 -c "import json; print(json.load(open('public/prediction-history.json')).get('trained_through',''))" 2>/dev/null || echo "")
          if [ -z "$trained" ] || [[ "$trained" < "$yesterday" ]]; then
            echo "Running full publish pipeline (history stale)..."
            npm run model:daily:core
          else
            echo "History current; running lock + health only."
            python3 scripts/model/model_health.py || true
            python3 scripts/model/lock_daily_ticket.py
            python3 scripts/model/consistency_audit.py
          fi

      - name: Update live bankroll
        continue-on-error: true
        run: python3 scripts/model/update_live_bankroll.py

      - name: Verify board integrity
        run: python3 scripts/model/prediction_integrity.py --full --strict-recompute

      - name: Commit and push refreshed board
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/predictions.json public/live-bankroll.json public/prediction-history.json public/accuracy.json public/model-health.json public/locked-ticket.json data/locked-tickets/*.json data/live-bankroll-state.json data/model/daily_edge.pkl
          if git diff --staged --quiet; then
            echo "Board unchanged since last refresh (lines/probabilities identical)."
            exit 0
          fi
          git commit -m "Refresh live MLB board ($(TZ=America/Chicago date '+%Y-%m-%d %I:%M %p %Z'))"
          git pull --rebase origin main
          git push origin main

      - name: Verify live board timestamp
        run: |
          set -euo pipefail
          today=$(date +%F)
          generated=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['generated_at'])")
          if [ "$generated" != "$today" ]; then
            echo "::error::Expected generated_at=${today}, got ${generated}"
            exit 1
          fi
          echo "Board published for ${today} ($(python3 -c "import json; print(len(json.load(open('public/predictions.json'))['predictions']))") games)."
