name: Refresh Live Board

# RE-ENABLED 2026-07-19 at user request: keeps the live board (odds, probabilities,
# confidence) fresh through the day so the website stays current. The first lock of
# the day still wins — refreshes never overwrite the locked daily ticket.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13-23 * * *"  # hourly 8 AM–6 PM CT — keep live odds/board fresh during game hours
    - cron: "0 0-3 * * *"    # hourly 7–10 PM CT — cover night games

permissions:
  contents: write

concurrency:
  group: mlb-board-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Chicago
      PYTHONPATH: scripts/model
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Restore pitcher/team stat caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache/pitcher_stats_asof
            data/cache/team_stats
          key: stats-cache-v2-${{ hashFiles('scripts/model/pitcher_stats_provider.py', 'scripts/model/team_stats_provider.py') }}
          restore-keys: |
            stats-cache-v2-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Regenerate today's board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
          ODDS_MARKETS: h2h,spreads,totals
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Board generation attempt ${attempt}/3..."
            if python3 scripts/model/generate_today_board.py 2>&1 | tee "board-gen-${attempt}.log"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::generate_today_board failed after 3 attempts"
              tail -40 "board-gen-${attempt}.log"
              exit 1
            fi
            echo "Retrying in 30s..."
            sleep 30
          done
          board_at=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['board_generated_at'])")
          generated=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['generated_at'])")
          today=$(date +%F)
          echo "board_generated_at=${board_at} generated_at=${generated}"
          test -n "${board_at}"
          if [ "${generated}" != "${today}" ]; then
            echo "::error::Expected generated_at=${today}, got ${generated}"
            exit 1
          fi

      - name: Prop publish guard unit tests
        run: |
          set -euo pipefail
          python3 scripts/model/test_prop_publish_guards.py
          python3 scripts/model/test_prop_card_guards.py

      - name: Regenerate PrizePicks prop board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROP_FORCE_ARCHIVE: "1"
        run: |
          set -euo pipefail
          python3 scripts/model/generate_prop_predictions.py
          python3 scripts/model/grade_prop_predictions.py || true
          props_at=$(python3 -c "import json; print(json.load(open('public/prop-predictions.json')).get('generated_at',''))")
          today=$(date +%F)
          echo "prop generated_at=${props_at}"
          if [ "${props_at}" != "${today}" ]; then
            echo "::error::Expected prop generated_at=${today}, got ${props_at}"
            exit 1
          fi
          # Defense in depth: re-scan the file that would ship.
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts/model")
          from prop_publish_guards import assert_payload_sane
          assert_payload_sane(json.load(open("public/prop-predictions.json")))
          print("prop_publish_guards_file_ok")
          PY

      - name: History / lock / health (never re-run full daily:core)
        run: |
          set -euo pipefail
          # Board + props already regenerated above. Re-running model:daily:core here
          # used to burn 60–90 minutes, exhaust Odds API quota, and cancel sibling jobs.
          yesterday=$(python3 -c "from datetime import date, timedelta; print((date.today()-timedelta(days=1)).isoformat())")
          trained=$(python3 -c "import json; print(json.load(open('public/prediction-history.json')).get('trained_through',''))" 2>/dev/null || echo "")
          if [ -z "$trained" ] || [[ "$trained" < "$yesterday" ]]; then
            echo "History stale (trained_through=${trained:-missing}); refreshing history outputs..."
            python3 scripts/model/generate_prediction_history.py
            python3 scripts/model/generate_accuracy_output.py
            python3 scripts/model/clv_tracker.py || true
          else
            echo "History current (trained_through=${trained})."
          fi
          python3 scripts/model/model_health.py || true
          python3 scripts/model/rolling_strategy_guard.py || true
          python3 scripts/model/generate_live_strategy_metrics.py || true
          python3 scripts/model/lock_daily_ticket.py
          python3 scripts/model/consistency_audit.py

      - name: Update live bankroll
        continue-on-error: true
        run: python3 scripts/model/update_live_bankroll.py

      - name: Verify board integrity
        run: python3 scripts/model/prediction_integrity.py --full --strict-recompute

      - name: Commit and push refreshed board
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/predictions.json public/live-bankroll.json public/prediction-history.json public/accuracy.json public/model-health.json public/locked-ticket.json public/prop-predictions.json public/prop-track-record.json data/locked-tickets/*.json data/prop-predictions/*.json data/live-bankroll-state.json data/model/daily_edge.pkl
          if git diff --staged --quiet; then
            echo "Board unchanged since last refresh (lines/probabilities identical)."
            exit 0
          fi
          git commit -m "Refresh live MLB board ($(TZ=America/Chicago date '+%Y-%m-%d %I:%M %p %Z'))"
          git pull --rebase origin main
          git push origin main

      - name: Verify live board timestamp
        run: |
          set -euo pipefail
          today=$(date +%F)
          generated=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['generated_at'])")
          if [ "$generated" != "$today" ]; then
            echo "::error::Expected generated_at=${today}, got ${generated}"
            exit 1
          fi
          echo "Board published for ${today} ($(python3 -c "import json; print(len(json.load(open('public/predictions.json'))['predictions']))") games)."
