name: Refresh Live Board

# DISABLED schedules — superseded by publish-board.yml (same job, fewer crons, no
# full retrain nested inside refresh). Manual dispatch only if you need the old path.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-board-publish
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Chicago
      PYTHONPATH: scripts/model
    steps:
      - name: Redirect
        run: |
          echo "Use workflow 'Publish Live Board' instead."
          echo "This workflow's schedules are disabled on purpose."
          exit 1
