name: Prediction Integrity

# DISABLED 2026-06-24 at user request (turn off all automation). This was a passive
# CI validator (it never edits the repo), but it's manual-only now so nothing runs
# automatically. Re-add the push/pull_request triggers to re-enable.
on:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: scripts/model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: TypeScript build must load board without confidence mismatch
        run: npm run build

      - name: Validate board schema
        run: python3 scripts/model/prediction_integrity.py --verbose

      - name: Validate ticket and accuracy sync
        run: python3 scripts/model/prediction_integrity.py --full
