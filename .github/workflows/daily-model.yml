name: Daily Model Retrain

# DISABLED schedules — this fat pipeline cancelled/failed for weeks and never
# produced github-actions[bot] publishes. Live site updates via publish-board.yml.
# Kept for manual research / full history rebuild only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-board-publish
  cancel-in-progress: true

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Chicago
      PYTHONPATH: scripts/model
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Restore pitcher/team stat caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache/pitcher_stats_asof
            data/cache/team_stats
          key: stats-cache-v2-${{ hashFiles('scripts/model/pitcher_stats_provider.py', 'scripts/model/team_stats_provider.py') }}
          restore-keys: |
            stats-cache-v2-

      - name: Install
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Full daily core (manual only)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
          ODDS_MARKETS: h2h,spreads,totals
          PROP_FORCE_ARCHIVE: "1"
        run: npm run model:daily:core

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*.json data/locked-tickets/*.json data/prop-predictions/*.json data/model/*.pkl || true
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Manual full daily core $(date +%F)"
          git pull --rebase origin main
          git push origin main
