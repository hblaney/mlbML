name: Daily Model Retrain

on:
  schedule:
    # ~5 AM Central (10:00 UTC during CDT).
    - cron: "0 10 * * *"
    # ~7 AM Central backup if the board is still stale.
    - cron: "0 12 * * *"
    # ~9 AM Central second backup.
    - cron: "0 14 * * *"
    # ~11 AM Central third backup.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-model-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Chicago
      PYTHONPATH: scripts/model
    steps:
      - name: Decide whether to run
        id: run_control
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          today=$(date +%F)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run requested for ${today}."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          generated=$(
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/public/predictions.json" \
              | python3 -c "import sys, json; print(json.load(sys.stdin).get('generated_at', ''))" \
              || echo ""
          )

          if [ "$generated" = "$today" ]; then
            echo "Board already fresh for ${today}; skipping scheduled run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Board stale (${generated:-missing} vs ${today}); running daily update."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.run_control.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        if: steps.run_control.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        if: steps.run_control.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        if: steps.run_control.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        if: steps.run_control.outputs.should_run == 'true'
        run: npm ci

      - name: Retrain model and regenerate public outputs
        if: steps.run_control.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
          ODDS_MARKETS: h2h,spreads,totals
        run: npm run model:daily

      - name: Verify board integrity before commit
        if: steps.run_control.outputs.should_run == 'true'
        run: python3 scripts/model/prediction_integrity.py --full --strict-recompute

      - name: Commit updated model outputs
        if: steps.run_control.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/*.json \
            data/live-bankroll-state.json \
            data/historical_odds.jsonl \
            data/model/*.pkl \
            data/cache/*.json
          if git diff --staged --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Update daily MLB model outputs for $(date +%F)"
          git pull --rebase origin main
          git push origin main

      - name: Verify today's board was published
        if: steps.run_control.outputs.should_run == 'true'
        run: |
          today=$(date +%F)
          generated=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['generated_at'])")
          if [ "$generated" != "$today" ]; then
            echo "Expected generated_at=${today}, got ${generated}"
            exit 1
          fi
          acc_trained=$(python3 -c "import json; print(json.load(open('public/accuracy.json')).get('trained_through',''))")
          board_trained=$(python3 -c "import json; print(json.load(open('public/predictions.json')).get('trained_through',''))")
          if [ -n "$acc_trained" ] && [ -n "$board_trained" ] && [[ "$board_trained" < "$acc_trained" ]]; then
            echo "predictions trained_through=${board_trained} is behind accuracy ${acc_trained}"
            exit 1
          fi
          echo "Board published for ${today} with $(python3 -c "import json; print(len(json.load(open('public/predictions.json'))['predictions']))") games."
