name: Ensure Today Board

# Manual only. The old offset-minute schedule fired ~30 times/day and almost
# always skipped with "No jobs were run" because it shares a concurrency group
# with Publish Live Board — GitHub then emailed every skip as a failed run.
# Live publishes stay on publish-board.yml.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-board-publish
  cancel-in-progress: false

jobs:
  ensure:
    uses: ./.github/workflows/publish-board.yml
    secrets: inherit
