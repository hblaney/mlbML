name: Publish Live Board

# Minimal path that actually ships the site. No history rebuild, no research scripts,
# no late strict-recompute. Success = github-actions[bot] commit with today's board.
#
# RELIABILITY: GitHub's cron scheduler is best-effort — it delays top-of-hour jobs
# and sometimes drops a tick entirely. So each publish window has MULTIPLE ticks,
# and a guard job skips the run when the board was already published recently. A
# single dropped GitHub tick can no longer mean "no board today."
on:
  workflow_dispatch:
  schedule:
    # Morning publish (~11 AM CT). Three ticks so a dropped/late tick self-heals.
    - cron: "0,30 16 * * *"
    - cron: "0 17 * * *"
    # Afternoon refresh (~3 PM CT).
    - cron: "0,30 20 * * *"
    - cron: "0 21 * * *"
    # Evening refresh (~8 PM CT).
    - cron: "0,30 1 * * *"
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: mlb-board-publish
  cancel-in-progress: true

jobs:
  # Idempotency gate: only publish when the last board is stale (or on manual run).
  # Catch-up ticks within the same window see a fresh board and no-op, so the
  # locked card isn't rebuilt three times an hour.
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Decide whether to publish
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch -> publish"
            exit 0
          fi
          # Minutes since the last board was published. Publish windows are >=4h
          # apart, so a 150m freshness window lets each window's first tick
          # publish while later catch-up ticks (same hour) no-op.
          age=$(python3 -c "import json; from datetime import datetime, timezone; d=json.load(open('public/prop-predictions.json')); t=datetime.fromisoformat(d['board_generated_at'].replace('Z','+00:00')); print(int((datetime.now(timezone.utc)-t).total_seconds()//60))" 2>/dev/null || echo 99999)
          echo "last board age: ${age} min"
          if [ "${age}" -lt 150 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "board published <150m ago -> skip (redundant catch-up tick)"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "board stale -> publish"
          fi

  publish:
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Chicago
      PYTHONPATH: scripts/model
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_REGIONS: us
      ODDS_MARKETS: h2h,spreads,totals
      PROP_FORCE_ARCHIVE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore pitcher/team stat caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache/pitcher_stats_asof
            data/cache/team_stats
          key: stats-cache-v2-${{ hashFiles('scripts/model/pitcher_stats_provider.py', 'scripts/model/team_stats_provider.py') }}
          restore-keys: |
            stats-cache-v2-

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate moneyline board
        run: python3 scripts/model/generate_today_board.py

      - name: Generate props board
        run: python3 scripts/model/generate_prop_predictions.py

      - name: Lock daily ticket
        run: python3 scripts/model/lock_daily_ticket.py

      # Intentionally no prop grading here — it can hang 20+ min on MLB gamelogs
      # and previously blocked the commit even with continue-on-error (job timeout).

      - name: Require today's timestamps
        run: |
          set -euo pipefail
          today=$(date +%F)
          ml=$(python3 -c "import json; print(json.load(open('public/predictions.json'))['generated_at'])")
          props=$(python3 -c "import json; print(json.load(open('public/prop-predictions.json')).get('generated_at',''))")
          n=$(python3 -c "import json; print(len(json.load(open('public/predictions.json')).get('predictions') or []))")
          echo "ml=${ml} props=${props} games=${n}"
          test "${ml}" = "${today}"
          test "${props}" = "${today}"
          test "${n}" -gt 0

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/predictions.json \
            public/prop-predictions.json \
            public/locked-ticket.json \
            public/prizepicks-slip.json \
            public/prop-bet-cards.json \
            public/prop-leans.json \
            public/prop-track-record.json \
            data/locked-tickets/*.json \
            data/prop-predictions/*.json \
            data/model/daily_edge.pkl \
            || true
          if git diff --staged --quiet; then
            echo "No board file changes to commit (already current)."
            exit 0
          fi
          git commit -m "Auto-publish board $(TZ=America/Chicago date '+%Y-%m-%d %I:%M %p %Z')"
          git pull --rebase origin main
          git push origin main
          echo "PUBLISHED_BY_BOT=1"
